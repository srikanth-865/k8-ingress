apiVersion: apps/v1
kind: Deployment
metadata:
  name: app-1
  # labels related to deployment resource
  labels:
    app: app-1
spec:
  replicas: 2
  selector:
    matchLabels:
      app: app-1
  # Pod
  template:
    metadata:
      labels:
        app: app-1
    spec:
      containers:
      - name: app-1
        image: joindevops/app1
        ports:
        - containerPort: 80
---
apiVersion: v1
kind: Service
metadata:
  name: app-1
  # servicer labels
  labels:
    app: app-1
spec:
  # Service uses the below labels to select the pods
  selector:
    app: app-1
  ports:
    - protocol: TCP
      port: 80 # service port use for Other apps inside our cluster talk to the Service on port 80.
      targetPort: 80 # container port use for Service forwards that traffic straight to port 80 inside joindevops/app1 container
#it creates a Load Balancer ingress
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: app-1
  annotations:
    alb.ingress.kubernetes.io/scheme: internet-facing
    alb.ingress.kubernetes.io/listen-ports: '[{"HTTPS": 443}]'
    alb.ingress.kubernetes.io/certificate-arn: arn:aws:acm:us-east-1:349627593718:certificate/30b030dd-364d-494a-91df-837bcd46b499
    alb.ingress.kubernetes.io/target-type: ip
    alb.ingress.kubernetes.io/tags: Environment=dev,Team=test
    alb.ingress.kubernetes.io/group.name: roboshop
spec:
  ingressClassName: alb
  rules: # its oour routing rules
  - host: "app1.srikanth865.online"  #its our DNS name
    http:
      paths:
      - pathType: Prefix
        path: "/"  #tells the load balancer to match any URL path that starts with a forward slash (/). Because it is a prefix match for /, it essentially catches all incoming traffic sent to this domain (app1.srikanth865.online)
        backend: #This defines the destination where the ALB should send the matched traffic inside the cluster.
          service:
            name: app-1 #This points to a Kubernetes Service named app-1. The AWS Load Balancer Controller will look at the Pods connected to this Service and automatically register their IP addresses into the AWS ALB's Target Group.
            port:
              number: 80

